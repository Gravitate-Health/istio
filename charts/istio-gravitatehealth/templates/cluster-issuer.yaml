{{- if and .Values.certManager.enabled (not .Values.gateway.useIP) }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer.name }}
  namespace: {{ .Values.certManager.namespace }}
  labels:
    {{- include "istio-gravitatehealth.labels" . | nindent 4 }}
spec:
  acme:
    email: {{ .Values.certManager.clusterIssuer.email }}
    server: {{ .Values.certManager.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer.privateKeySecretRef }}
    solvers:
    {{- if eq .Values.certManager.clusterIssuer.challengeType "http01" }}
    - http01:
        ingress:
          class: {{ .Values.certManager.clusterIssuer.ingressClass }}
    {{- else if eq .Values.certManager.clusterIssuer.challengeType "dns01" }}
    - dns01:
        {{- toYaml .Values.certManager.clusterIssuer.dns01Solver | nindent 8 }}
    {{- end }}
{{- end }}
