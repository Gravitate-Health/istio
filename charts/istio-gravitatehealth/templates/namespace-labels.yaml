{{- if .Values.istio.namespaceLabels }}
{{- range $namespace := .Values.istio.namespaceLabels }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace.name }}
  labels:
    {{- if $namespace.istioInjection }}
    istio-injection: enabled
    {{- else }}
    istio-injection: disabled
    {{- end }}
    {{- with $namespace.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}
